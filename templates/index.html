<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gateway</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 12px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-right: 8px;
        }

        .selector-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .selector-label {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .selector {
            display: flex;
            gap: 4px;
        }

        .sel-btn {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #888;
            cursor: pointer;
            transition: all 0.15s;
        }

        .sel-btn:hover:not(.disabled) {
            border-color: #555;
            color: #ccc;
        }

        .sel-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .sel-btn.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            position: relative;
        }

        .sel-btn.disabled::after {
            content: 'soon';
            font-size: 9px;
            margin-left: 4px;
            color: #666;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: #2a2a2a;
            margin: 0 4px;
        }

        .status-badge {
            font-size: 11px;
            background: #2a2a2a;
            color: #888;
            padding: 3px 8px;
            border-radius: 20px;
            margin-left: auto;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
        }

        .user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            align-self: flex-start;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-bottom-left-radius: 4px;
        }

        .assistant h1, .assistant h2, .assistant h3 {
            color: #fff;
            margin: 12px 0 6px;
        }

        .assistant h1 { font-size: 18px; }
        .assistant h2 { font-size: 16px; }
        .assistant h3 { font-size: 14px; }

        .assistant p { margin: 6px 0; }

        .assistant ul, .assistant ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        .assistant li { margin: 4px 0; }

        .assistant code {
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        .assistant pre {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .assistant pre code { background: none; padding: 0; }

        .assistant strong { color: #fff; }

        .assistant hr {
            border: none;
            border-top: 1px solid #2a2a2a;
            margin: 12px 0;
        }

        .thinking {
            align-self: flex-start;
            color: #666;
            font-size: 14px;
            padding: 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #666;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        #input-area {
            padding: 16px 20px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #query {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 120px;
            min-height: 48px;
            font-family: inherit;
            line-height: 1.5;
        }

        #query:focus { border-color: #2563eb; }
        #query::placeholder { color: #555; }

        #send {
            background: #2563eb;
            border: none;
            border-radius: 10px;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        #send:hover { background: #1d4ed8; }
        #send:disabled { background: #1a2a4a; cursor: not-allowed; }
        #send svg { width: 18px; height: 18px; fill: white; }

        .empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #444;
            gap: 8px;
        }

        .empty h2 { font-size: 20px; color: #555; }
        .empty p { font-size: 14px; }
    </style>
</head>
<body>

<header>
    <h1>AI Gateway</h1>

    <div class="divider"></div>

    <div class="selector-group">
        <span class="selector-label">AI</span>
        <div class="selector" id="ai-selector">
            <button class="sel-btn active" data-ai="claude">Claude</button>
            <button class="sel-btn" data-ai="chatgpt">ChatGPT</button>
            <button class="sel-btn" data-ai="deepseek">DeepSeek</button>
            <button class="sel-btn" data-ai="gemini">Gemini</button>
            <button class="sel-btn" data-ai="grok">Grok</button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="selector-group">
        <span class="selector-label">Mode</span>
        <div class="selector" id="mode-selector">
            <button class="sel-btn active" data-mode="incognito">Incognito</button>
            <button class="sel-btn disabled" data-mode="stateful" disabled>Stateful</button>
        </div>
    </div>

    <span class="status-badge" id="status-badge">Claude · Incognito</span>
</header>

<div id="chat">
    <div class="empty" id="empty">
        <h2>Ask anything</h2>
        <p>Responses are not saved</p>
    </div>
</div>

<div id="input-area">
    <textarea id="query" placeholder="Type your question..." rows="1"></textarea>
    <button id="send" onclick="sendQuery()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
</div>

<script>
    const chat = document.getElementById('chat');
    const queryBox = document.getElementById('query');
    const sendBtn = document.getElementById('send');
    const empty = document.getElementById('empty');
    const statusBadge = document.getElementById('status-badge');

    let selectedAI = 'claude';
    let selectedMode = 'incognito';

    document.getElementById('ai-selector').addEventListener('click', (e) => {
        const btn = e.target.closest('.sel-btn');
        if (!btn || btn.classList.contains('disabled')) return;
        document.querySelectorAll('#ai-selector .sel-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedAI = btn.dataset.ai;
        updateBadge();
    });

    document.getElementById('mode-selector').addEventListener('click', (e) => {
        const btn = e.target.closest('.sel-btn');
        if (!btn || btn.classList.contains('disabled')) return;
        document.querySelectorAll('#mode-selector .sel-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMode = btn.dataset.mode;
        updateBadge();
    });

    function updateBadge() {
        const aiLabel = selectedAI.charAt(0).toUpperCase() + selectedAI.slice(1);
        const modeLabel = selectedMode.charAt(0).toUpperCase() + selectedMode.slice(1);
        statusBadge.textContent = `${aiLabel} · ${modeLabel}`;
    }

    queryBox.addEventListener('input', () => {
        queryBox.style.height = 'auto';
        queryBox.style.height = Math.min(queryBox.scrollHeight, 120) + 'px';
    });

    queryBox.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendQuery();
        }
    });

    function addMessage(text, role) {
        if (empty) empty.style.display = 'none';
        const div = document.createElement('div');
        div.className = `message ${role}`;
        if (role === 'assistant') {
            div.innerHTML = marked.parse(text);
        } else {
            div.textContent = text;
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function addThinking() {
        const aiLabel = selectedAI.charAt(0).toUpperCase() + selectedAI.slice(1);
        const div = document.createElement('div');
        div.className = 'thinking';
        div.id = 'thinking';
        div.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div><span>${aiLabel} is thinking...</span>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function removeThinking() {
        const t = document.getElementById('thinking');
        if (t) t.remove();
    }

    async function sendQuery() {
        const query = queryBox.value.trim();
        if (!query) return;

        queryBox.value = '';
        queryBox.style.height = 'auto';
        sendBtn.disabled = true;

        addMessage(query, 'user');
        addThinking();

        try {
            const res = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, ai: selectedAI, mode: selectedMode })
            });
            const data = await res.json();
            removeThinking();
            if (data.status === 'ok') {
                addMessage(data.reply, 'assistant');
            } else {
                addMessage('Error: ' + data.error, 'assistant');
            }
        } catch (err) {
            removeThinking();
            addMessage('Connection error: ' + err.message, 'assistant');
        }

        sendBtn.disabled = false;
        queryBox.focus();
    }
</script>

</body>
</html>
